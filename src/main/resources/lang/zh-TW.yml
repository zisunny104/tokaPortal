# tokaPortal 繁體中文語系檔（zh-TW），格式為 UTF-8。
# 使用共用套件 tokaI18n：${0}、${1}… 是依序代入的位置參數，沒寫到的參數不會出現。
# 伺服器擁有者可以把同名檔案放進 plugins/tokaPortal/lang/ 覆蓋個別文字，沒寫到的 key 仍使用 jar 內的內容。
# key 命名：cmd（指令說明與用法）、help（/指令 help 的多行說明）、msg（玩家訊息）、err（錯誤與拒絕）、
#           ui（表單標題、按鈕、內容與標題字幕）、log（後台文字）、status（狀態字）。
# 顏色慣例：§b 一般文字、§a 數字／名稱／成功、§e 警告、§c 錯誤、§7 次要說明、§6 標題；後台 log 不加方括號標籤。
# 玩家訊息統一以「§7[傳送]§r」開頭。

# ---------------------------------------------------------------
# 指令說明與用法（cmd.<指令>.desc 是客戶端指令清單看到的說明；usage 是用法）
# ---------------------------------------------------------------
cmd:
  back:
    desc: "返回前次傳送地點"
    usage: "/back"
  home:
    desc: "住家系統指令"
    usage: "/home [list|edit|set [名稱]|del [名稱]|help]"
  next:
    desc: "前往下個傳送地點"
    usage: "/next"
  portal:
    desc: "傳送系統指令"
    usage: "/portal [point <set|del> <名稱> [類型]|help]"
  spawn:
    desc: "回到重生點"
    usage: "/spawn"
  tpa:
    desc: "普通權限傳送"
    usage: "/tpa <玩家代號>"
  tph:
    desc: "傳送至住家"
    usage: "/tph [住家名稱]"
  tpl:
    desc: "傳送至領地"
    usage: "/tpl <領地名稱>"
  tpp:
    desc: "顯示傳送列表"
    usage: "/tpp [傳送點名稱]"
  tpw:
    desc: "傳送到世界"
    usage: "/tpw <世界名稱>"
  wild:
    desc: "資源世界隨機傳送"
    usage: "/wild"

# 指令參數在客戶端指令提示中顯示的名稱
param:
  action: "操作"
  newHomeName: "新住家名稱"
  homeName: "住家名稱"
  playerName: "玩家名稱"
  worldName: "世界名稱"
  landName: "領地名稱"

# ---------------------------------------------------------------
# /指令 help 的多行說明（第一行為標題，之後每行一個用法）
# ---------------------------------------------------------------
help:
  back:
    - "§6§l/back 說明"
    - "§e/back §7- §b返回前次傳送地點"
    - "§e/back help §7- §b顯示這份說明"
  home:
    - "§6§l/home 說明（僅管理員）"
    - "§e/home §7- §b開啟住家列表並傳送"
    - "§e/home list §7- §b開啟住家列表並傳送"
    - "§e/home edit §7- §b開啟住家編輯列表"
    - "§e/home set [名稱] §7- §b在目前位置設定住家；不寫名稱會開啟表單"
    - "§e/home del [名稱] §7- §b刪除住家；不寫名稱會開啟編輯列表"
    - "§e/home help §7- §b顯示這份說明"
  next:
    - "§6§l/next 說明"
    - "§e/next §7- §b前往下個傳送地點"
    - "§e/next help §7- §b顯示這份說明"
  # /portal help 的總覽。title=標題；needs=缺少功能時加在該行後面（${0}=缺少的功能）；other.*=其他 toka 插件已安裝時才顯示的指令
  overview:
    title: "§6§l傳送系統指令總覽"
    needs: "§e〔未啟用：${0}〕"
    other:
      worlds: "§e/worlds help §7- §b世界管理（掛載、卸載、更名；OP）"
      sign: "§e/sign help §7- §b告示牌（傳送牌、狀態牌等）的建立與維護"
  portal:
    - "§6§l/portal 說明"
    - "§e/portal §7- §b開啟傳送系統選單"
    - "§e/portal point set <名稱> [類型] §7- §b在目前位置建立公共傳送點（需要權限）"
    - "§e/portal point del <名稱> §7- §b刪除公共傳送點（建立者或 OP）"
    - "§e/back §7- §b返回前次傳送地點"
    - "§e/next §7- §b前往下個傳送地點"
    - "§e/portal help §7- §b顯示這份說明"
  spawn:
    - "§6§l/spawn 說明"
    - "§e/spawn §7- §b回到重生點"
    - "§e/spawn help §7- §b顯示這份說明"
  tpa:
    - "§6§l/tpa 說明"
    - "§e/tpa <玩家代號> §7- §b傳送到指定玩家身邊（依權限可能需要對方同意）"
    - "§e/tpa help §7- §b顯示這份說明"
  tph:
    - "§6§l/tph 說明（僅管理員）"
    - "§e/tph <住家名稱> §7- §b傳送到指定住家"
    - "§e/tph §7- §b開啟住家列表"
    - "§e/tph help §7- §b顯示這份說明"
  tpl:
    - "§6§l/tpl 說明"
    - "§e/tpl <領地名稱> §7- §b傳送到指定領地"
    - "§e/tpl §7- §b開啟領地列表"
    - "§e/tpl help §7- §b顯示這份說明"
  tpp:
    - "§6§l/tpp 說明"
    - "§e/tpp <傳送點名稱> §7- §b傳送到指定傳送點"
    - "§e/tpp §7- §b開啟傳送系統選單"
    - "§e/tpp help §7- §b顯示這份說明"
  tpw:
    - "§6§l/tpw 說明（僅 OP）"
    - "§e/tpw <世界名稱> §7- §b傳送到指定世界；世界未載入時會先載入"
    - "§e/tpw help §7- §b顯示這份說明"
  wild:
    - "§6§l/wild 說明"
    - "§e/wild §7- §b在資源世界內隨機傳送（有冷卻時間）"
    - "§e/wild help §7- §b顯示這份說明"

