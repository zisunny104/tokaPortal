      worlds: "§e/worlds help §7- §b世界管理（掛載、卸載、更名；OP）"
      sign: "§e/sign help §7- §b告示牌（傳送牌、狀態牌等）的建立與維護"
  portal:
    - "§6=== §f§l/portal 說明§r §6==="
    - "§e/portal §7- §b開啟傳送系統選單"
    - "§e/portal point set <名稱> [類型] §7- §b在目前位置建立公共傳送點（需要權限）"
    - "§e/portal point del <名稱> §7- §b刪除公共傳送點（建立者或 OP）"
    - "§e/portal legacy list [頁] §7- §b列出尚未對應玩家 UUID 的舊名稱住家與傳送點（OP）"
    - "§e/portal legacy claim <名稱> <玩家> §7- §b把該舊名稱的住家與傳送點全部交給指定玩家（OP）"
    - "§e/back §7- §b返回前次傳送地點"
    - "§e/next §7- §b前往下個傳送地點"
    - "§e/portal help §7- §b顯示這份說明"
  spawn:
    - "§6=== §f§l/spawn 說明§r §6==="
    - "§e/spawn §7- §b回到重生點"
    - "§e/spawn help §7- §b顯示這份說明"
  tpa:
    - "§6=== §f§l/tpa 說明§r §6==="
    - "§e/tpa <玩家代號> §7- §b傳送到指定玩家身邊（依權限可能需要對方同意）"
    - "§e/tpa help §7- §b顯示這份說明"
  tph:
    - "§6=== §f§l/tph 說明（僅管理員）§r §6==="
    - "§e/tph <住家名稱> §7- §b傳送到指定住家"
    - "§e/tph §7- §b開啟住家列表"
    - "§e/tph help §7- §b顯示這份說明"
  tpl:
    - "§6=== §f§l/tpl 說明§r §6==="
    - "§e/tpl <領地名稱> §7- §b傳送到指定領地"
    - "§e/tpl §7- §b開啟領地列表"
    - "§e/tpl help §7- §b顯示這份說明"
  tpp:
    - "§6=== §f§l/tpp 說明§r §6==="
    - "§e/tpp <傳送點名稱> §7- §b傳送到指定傳送點"
    - "§e/tpp §7- §b開啟傳送系統選單"
    - "§e/tpp help §7- §b顯示這份說明"
  tpw:
    - "§6=== §f§l/tpw 說明（僅 OP）§r §6==="
    - "§e/tpw <世界名稱> §7- §b傳送到指定世界；世界未載入時會先載入"
    - "§e/tpw help §7- §b顯示這份說明"
  wild:
    - "§6=== §f§l/wild 說明§r §6==="
    - "§e/wild §7- §b在 §a${0}§b 內隨機傳送，冷卻 §a${1}§b 秒"
    - "§e/wild help §7- §b顯示這份說明"

