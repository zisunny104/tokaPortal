    - "§e/portal server §7- §b跨伺服器目的地（尚未提供）"
    - "§e/portal reload §7- §b重新讀取設定、語系與資料（tokaPortal.admin）"
    - "§e/portal help [頁] §7- §b指令總覽，分頁顯示"
  spawn:
    - "§6=== §f§l/spawn 說明§r §6==="
    - "§e/spawn §7- §b回到重生點"
    - "§e/spawn help §7- §b顯示這份說明"
  tpa:
    - "§6=== §f§l/tpa 說明§r §6==="
    - "§e/tpa <玩家代號> §7- §b傳送到指定玩家身邊（對方用 /tpaccept 同意；依權限可能不需同意）"
