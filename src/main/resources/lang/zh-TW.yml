# tokaPortal 繁體中文語系檔（zh-TW），格式為 UTF-8。
# 使用共用套件 tokaI18n：${0}、${1}… 是依序代入的位置參數，沒寫到的參數不會出現。
# 伺服器擁有者可以把同名檔案放進 plugins/tokaPortal/lang/ 覆蓋個別文字，沒寫到的 key 仍使用 jar 內的內容。
# key 命名：cmd（指令說明與用法）、help（/指令 help 的多行說明）、msg（玩家訊息）、err（錯誤與拒絕）、
#           ui（表單標題、按鈕、內容與標題字幕）、log（後台文字）、status（狀態字）。
# 顏色慣例：§b 一般文字、§a 數字／名稱／成功、§e 警告、§c 錯誤、§7 次要說明、§6 標題；後台 log 不加方括號標籤。
# 玩家訊息統一以「§7[傳送]§r」開頭。

# ---------------------------------------------------------------
# 指令說明與用法（cmd.<指令>.desc 是客戶端指令清單看到的說明；usage 是用法）
# ---------------------------------------------------------------
cmd:
  back:
    desc: "返回前次傳送地點"
    usage: "/back"
  home:
    desc: "住家系統指令"
    usage: "/home [list|edit|set [名稱]|del [名稱]|help]"
  next:
    desc: "前往下個傳送地點"
    usage: "/next"
  portal:
    desc: "傳送系統指令"
    usage: "/portal [point [add|set|del <名稱> [類型]]|legacy <list [頁]|claim <名稱> <玩家>>|plan <status|mode|fields>|server|reload|help [頁]]"
  spawn:
    desc: "回到重生點"
    usage: "/spawn"
  tpa:
    desc: "普通權限傳送"
    usage: "/tpa <玩家代號>"
  tpahere:
    desc: "請玩家傳送到你身邊"
    usage: "/tpahere <玩家代號>"
  tpaccept:
    desc: "同意傳送請求"
    usage: "/tpaccept"
  tpdeny:
    desc: "拒絕傳送請求"
    usage: "/tpdeny"
  tpcancel:
    desc: "取消你發出的傳送請求"
    usage: "/tpcancel"
  dnd:
    desc: "勿擾：不接收傳送請求"
    usage: "/dnd [on|off]"
  tph:
    desc: "傳送至住家"
    usage: "/tph [住家名稱]"
  tpl:
    desc: "傳送至領地"
    usage: "/tpl <領地名稱或 UUID>"
  tpp:
    desc: "顯示傳送列表"
    usage: "/tpp [傳送點名稱]"
  tpw:
    desc: "傳送到世界"
    usage: "/tpw <世界名稱>"
  wild:
    desc: "指定世界內隨機傳送"
    usage: "/wild"

# 指令參數在客戶端指令提示中顯示的名稱
param:
  action: "操作"
  newHomeName: "新住家名稱"
  homeName: "住家名稱"
  playerName: "玩家名稱"
  worldName: "世界名稱"
  landName: "領地名稱"
  landNameOrId: "領地名稱或 UUID"
  page: "頁碼"
  manage: "管理"
  pointName: "傳送點名稱"
  pointType: "類型"
  legacyName: "舊名稱"
  mode: "模式"
  field: "欄位"

# ---------------------------------------------------------------
# /指令 help 的多行說明（第一行為標題，之後每行一個用法）
# ---------------------------------------------------------------
help:
  back:
    - "§6=== §f§l/back 說明§r §6==="
    - "§e/back §7- §b返回前次傳送地點"
    - "§e/back help §7- §b顯示這份說明"
  home:
    - "§6=== §f§l/home 說明（僅管理員）§r §6==="
    - "§e/home §7- §b開啟住家列表並傳送"
    - "§e/home list §7- §b開啟住家列表並傳送"
    - "§e/home edit §7- §b開啟住家編輯列表"
    - "§e/home set [名稱] §7- §b在目前位置設定住家；不寫名稱會開啟表單"
