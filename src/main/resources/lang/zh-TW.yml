    tpaPrompt: "玩家 ${0} 想要傳送到你身邊"
    pointList:
      title: "=傳送點列表="
      hint:
        - "傳送點列表 "
        - "點擊進行傳送"
    shopboxList:
      title: "=商店列表="
      hint: "點擊進行傳送"
    regionList:
