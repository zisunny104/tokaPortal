    title: "§6=== §f§l傳送系統指令總覽§r §6==="
    needs: "§e〔未啟用：${0}〕"
    other:
      worlds: "§e/world help §7- §b世界管理（掛載、卸載、更名；OP）"
      sign: "§e/sign help §7- §b告示牌（傳送牌、狀態牌等）的建立與維護"
  portal:
    - "§6=== §f§l/portal 說明§r §6==="
    - "§e/portal §7- §b開啟傳送系統選單"
    - "§e/portal point §7[add|set|del <名稱> [類型]] §7- §b公共傳送點：不寫參數開管理視窗；del 限建立者或 OP（tokaPortal.points.manage）；/tpp 可代替 point"
