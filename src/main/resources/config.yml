# 新安裝使用共用 tokaStorage，預設 SQLite。
# 舊設定的 storage.type 維持原資料；切換需停服明確匯入。
storage:
  backend: sqlite

# /wild（隨機傳送）：只有在 worlds 列出的世界內可以使用，填世界名稱（資料夾名稱），可以列多個。
# 例如 worlds: [resource, nether]；列表是空的就沒有任何世界可以使用。
# cooldown-seconds：冷卻秒數；radius：以目前位置為中心的隨機範圍（格）；attempts：找不到安全落點時最多重試幾次。
wild:
  worlds: [resource]
  cooldown-seconds: 40
  radius: 375
  attempts: 16
  show-cooldown: true

