# tokaPortal 設定檔。修改後需重新啟動伺服器才會生效。

# 顯示語言：決定插件訊息、表單與後台文字的語言（對應 lang/<語言>.yml）。
# 目前只提供 zh-TW（繁體中文）；填入尚未提供的語言時，找不到的文字會退回 en-US，再退回顯示 key。
# 伺服器擁有者可把同名檔放進 plugins/tokaPortal/lang/ 覆蓋個別文字。
language: zh-TW

# 不能拿來當住家、傳送點名稱的字（不分大小寫）。這些字是指令的關鍵字，例如 /tph help 會顯示說明；
# 禁止它們被取成名稱，就不會發生「名稱被當成關鍵字」的情況。已經存在的同名住家不受影響。
reserved-names:
  - help
  - list
  - set
  - del
  - edit

# 資料儲存（住家與公共傳送點共用）：新安裝使用共用 tokaStorage，預設 SQLite。
# 舊設定的 storage.type 維持原資料；切換儲存格式需停服並明確匯入，不能只改這裡。
storage:
  # backend 可填 sqlite、json、yaml。啟用後不要只改這個值來切換，插件會偵測到另一種儲存目錄並拒絕啟動。
  backend: sqlite

# /wild（隨機傳送）：只有在 worlds 列出的世界內可以使用，填世界名稱（資料夾名稱），可以列多個。
# 例如 worlds: [resource, nether]；列表是空的就沒有任何世界可以使用。
wild:
  # 可以使用 /wild 的世界名稱清單。
  worlds: [resource]
  # 冷卻秒數：1 到 86400 的整數，預設 40。
  cooldown-seconds: 40
  # 以目前位置為中心的隨機範圍（格）：1 到 10000 的整數，預設 375。
  radius: 375
  # 找不到安全落點時最多重試幾次：1 到 64 的整數，預設 16。
  attempts: 16
  # 冷卻中是否在血條下面顯示一行冷卻，並用血條表示冷卻進度（需要 tokaDisplay）。可填 true 或 false。
  show-cooldown: true
  # 冷卻中血條的顏色：tokaDisplay 的 7 種顏色之一，或它 config.yml 裡 colors 的別名；空白則用預設顏色。
  bar-color: cooldown

# /portal help 總覽每頁顯示幾行（最少 3）。
help-lines-per-page: 8

# 選單視窗的清單（傳送點、商店、區域、領地、玩家）設定。超過一頁會自動分頁，出現上一頁／下一頁按鈕。
# 每頁顯示幾項的預設值（玩家可以在清單的「搜尋／排序／每頁數量」視窗自己調整，調整後保留到離開伺服器）。
window-items-per-page: 10
# 玩家可以調整的每頁項目數下限與上限。
window-items-min: 3
window-items-max: 30
# 清單項目超過幾項時才顯示「搜尋／排序／每頁數量」按鈕（搜尋中一定會顯示）。
window-search-threshold: 8
# 選單按鈕是否顯示圖示（使用遊戲內建材質）。可填 true 或 false；選單中沒有內容的項目（例如沒有領地、沒有其他玩家）一律隱藏。
window-icons: true

# 選用 Plan DataExtension，僅提供數量，不公開住家名稱、世界或座標。
# 透過 Main.reload() 或重新啟動套用；停用後 Plan 既有資料須在 Plan 管理。
plan:
  mode: auto # auto 自動偵測；enable 未就緒時提示；disable 不發布。
  fields: all # all | none | 欄位清單；指令可逐項管理。
  # 主執行緒發布快照間隔，限制 5 至 3600 秒。
  refresh-seconds: 30


