#插件名稱
name: tokaPortal

#插件主檔案
main: dev.toka.pl.tokaPortal.Main

#插件版本
version: "2.9.12"

#核心API版本
api: ["1.0.11"]

#插件載入選項[POSTWORLD, STARTUP]
load: POSTWORLD

#插件描述
description: "[prjToka]傳送插件"

#插件網站
#website: ""

#插件依賴
#depend: []
softdepend: [tokaRegions, tokaLand, tokaDisplay, tokaEconomy, tokaProfiles, Plan]


permissions:
  tokaPortal.points.manage:
    description: 管理公共傳送點
    default: op


  tokaportal.tpa.silent:
    description: "/tpa 靜默傳送：不通知對方、立刻傳送，抵達後隱身一小段時間（管理員身分與 OP 本來就有）"
    default: op

  tokaportal.tpa.force:
    description: "/tpa 強制傳送：不徵求同意，對方頂端顯示倒數，可用 /tpdeny 阻止（贊助者身分本來就有）"
    default: false

  tokaportal.dnd.unlimited:
    description: "/dnd 勿擾不限時間（一般玩家有 dnd.max-minutes 的上限）"
    default: false

  tokaPortal.admin:
    description: "管理 Plan 展示設定並重新載入設定"
    default: op
